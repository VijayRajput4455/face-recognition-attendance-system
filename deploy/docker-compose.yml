# ==========================================================
# FACE RECOGNITION SYSTEM - BASE COMPOSE
#
# Production / Staging Base Definition
# ==========================================================

services:

  # ========================================================
  # Frontend Web Application
  # ========================================================
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    depends_on:
      - api
    networks:
      - face-network

  # ========================================================
  # FastAPI Application
  # ========================================================
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: postgres
      RABBITMQ_HOST: rabbitmq
      MILVUS_URI: http://milvus:19530
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      milvus:
        condition: service_started
    networks:
      - face-network

  # ========================================================
  # Background Video Enrollment Worker
  # ========================================================
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: postgres
      RABBITMQ_HOST: rabbitmq
      MILVUS_URI: http://milvus:19530
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      milvus:
        condition: service_started
    networks:
      - face-network

  # ========================================================
  # PostgreSQL Database
  # ========================================================
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - face-network

  # ========================================================
  # RabbitMQ Message Broker
  # ========================================================
  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - face-network

  # ========================================================
  # Milvus Vector Database
  # ========================================================
  milvus:
    image: milvusdb/milvus:v2.4.4
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    networks:
      - face-network

  # ========================================================
  # ETCD (Milvus Metadata)
  # ========================================================
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd --advertise-client-urls=http://127.0.0.1:2379 --listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    networks:
      - face-network

  # ========================================================
  # MinIO (Milvus Object Storage)
  # ========================================================
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - face-network

# ==========================================================
# Volumes
# ==========================================================
volumes:
  postgres_data:
  rabbitmq_data:
  milvus_data:
  etcd_data:
  minio_data:

# ==========================================================
# Networks
# ==========================================================
networks:
  face-network:
    name: face-recognition-attendance-system_face-network
    driver: bridge
