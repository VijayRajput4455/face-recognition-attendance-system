# ==========================================================
# DEVELOPMENT CONFIGURATION OVERRIDE
#
# Usage:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml up --build
# ==========================================================

services:

  # ========================================================
  # Frontend Development (Vite HMR & Proxy)
  # ========================================================
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend.dev
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_TARGET=http://api:8000
    volumes:
      - ../frontend:/app
      - /app/node_modules
    restart: unless-stopped

  # ========================================================
  # FastAPI Development (Auto-Reload & Direct Volume)
  # ========================================================
  api:
    ports:
      - "8000:8000"
    volumes:
      - ..:/app
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  # ========================================================
  # Worker Development
  # ========================================================
  worker:
    volumes:
      - ..:/app
    restart: unless-stopped

  # ========================================================
  # Ports for local tool access
  # ========================================================
  postgres:
    ports:
      - "5432:5432"
    restart: unless-stopped

  rabbitmq:
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped

  minio:
    ports:
      - "9000:9000"
    restart: unless-stopped

  milvus:
    ports:
      - "19530:19530"
      - "9091:9091"
    restart: unless-stopped

  etcd:
    restart: unless-stopped
